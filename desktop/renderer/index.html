<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>Wordbook Study</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">W</span><span>Wordbook</span></div>
      <nav aria-label="メインメニュー">
        <button class="nav-item active" data-view="study">学習</button>
        <button class="nav-item" data-view="library">単語</button>
        <button class="nav-item" data-view="settings">設定</button>
      </nav>
      <div class="sidebar-foot">
        <strong id="wordCount">0</strong><span> 語を収録</span>
      </div>
    </aside>

    <main>
      <section class="view active" id="studyView">
        <header class="page-header">
          <div><p class="eyebrow">TODAY</p><h1>実際に選んで覚える</h1></div>
          <div class="metric"><strong id="accuracy">—</strong><span>正答率</span></div>
        </header>
        <div class="study-card" id="studyCard">
          <div class="welcome" id="welcome">
            <span class="mode-tag">4つの実践形式</span>
            <h2>状況、使い分け、誤用、穴埋め。</h2>
            <p>AIが手持ちの単語から問題を作ります。履歴に応じて未学習・復習予定の語を優先します。</p>
            <button class="primary" id="startStudy">学習を始める</button>
            <p class="hint" id="studyHint"></p>
          </div>
          <div class="quiz" id="quiz" hidden>
            <div class="quiz-top"><span class="mode-tag" id="modeLabel"></span><span id="providerBadge"></span></div>
            <h2 id="question"></h2>
            <div class="options" id="options"></div>
            <div class="result" id="result" hidden>
              <strong id="resultTitle"></strong>
              <p id="explanation"></p>
              <button class="primary" id="nextQuestion">次の問題</button>
            </div>
          </div>
          <div class="loading" id="loading" hidden><span></span><p>問題を作っています…</p></div>
        </div>
        <div class="stats-grid">
          <article><span>回答</span><strong id="attemptCount">0</strong></article>
          <article><span>正解</span><strong id="correctCount">0</strong></article>
          <article><span>今日の復習対象</span><strong id="dueCount">0</strong></article>
        </div>
      </section>

      <section class="view" id="libraryView">
        <header class="page-header"><div><p class="eyebrow">LIBRARY</p><h1>学習する単語</h1></div></header>
        <div class="toolbar">
          <label class="file-button">CSV / JSON を読み込む<input id="wordFile" type="file" accept=".csv,.json,text/csv,application/json"></label>
          <input class="search" id="wordSearch" type="search" placeholder="単語や意味を検索">
        </div>
        <p class="notice" id="importStatus">Chrome 拡張の「書き出す」で作成した CSV をそのまま利用できます。</p>
        <div class="word-list" id="wordList"></div>
      </section>

      <section class="view" id="settingsView">
        <header class="page-header"><div><p class="eyebrow">AI PROVIDER</p><h1>生成設定</h1></div></header>
        <form class="settings-card" id="settingsForm">
          <label>プロバイダー<select id="provider"><option value="openai-compatible">OpenAI 互換 API</option></select></label>
          <label>API base URL<input id="baseUrl" type="url" required placeholder="http://127.0.0.1:3000/api"></label>
          <label>モデル<input id="model" type="text" required placeholder="gpt-5.4 など"></label>
          <label>API key<input id="apiKey" type="password" autocomplete="off" placeholder="保存済みの場合は空欄のまま"></label>
          <label>追加パラメータ（JSON）<textarea id="additionalParams" rows="5" spellcheck="false">{}</textarea></label>
          <p class="notice">APIキーは OS の暗号化機能を使い、アプリ専用領域に保存します。ログやプロジェクトには書き込みません。</p>
          <div class="form-actions"><button type="button" class="secondary" id="testProvider">接続を確認</button><button type="submit" class="primary">保存</button></div>
          <p class="form-status" id="settingsStatus" role="status"></p>
        </form>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
