<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>Word Collector</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header>
    <h1><img src="icon.png" alt="icon" style="width: 16px; height: 16px;"> Word Collector</h1>
    <span id="count">0</span>
  </header>

  <main>
    <button id="show">単語を表示</button>
    <ul id="wordList" hidden></ul>
    <input id="search" placeholder="検索…" />
  </main>

  <footer>
    <button id="export">Export CSV</button>
    <button id="remove">Remove selected</button>
  </footer>


  <script src="popup.js"></script>
</body>

</html>
