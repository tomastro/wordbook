<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>Wordbook</title>
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <header>
    <div class="header-left">
      <img src="icon.png" alt="" class="header-icon">
      <h1>Wordbook</h1>
    </div>
    <span id="count" class="badge"><span id="countText">0語</span></span>
  </header>

  <main>
    <label class="sr-only" for="search">単語を検索</label>
    <div class="search-wrapper">
      <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input id="search" placeholder="単語を検索、または新しく調べる" autocomplete="off" />
      <button id="clearSearch" class="clear-search-btn" title="検索をクリア" hidden aria-label="検索をクリア">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <span class="search-shortcut" title="Enterキーで辞書を開く">Enter</span>
    </div>

    <div id="emptyState" class="empty-state" hidden>
      <div class="empty-icon-wrap">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          <line x1="9" y1="7" x2="15" y2="7"></line>
          <line x1="9" y1="11" x2="13" y2="11"></line>
        </svg>
      </div>
      <p id="emptyTitle" class="empty-title">単語はまだありません</p>
      <p id="emptyDesc" class="empty-desc">Webページで単語を選択して右クリックすると追加できます。</p>
    </div>

    <ul id="wordList" aria-label="保存した単語"></ul>
  </main>

  <footer>
    <p id="selectionStatus" class="selection-status" aria-live="polite">単語を選択して削除</p>
    <div class="footer-actions">
      <button id="export" class="btn btn-secondary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        CSVを書き出す
      </button>
      <button id="remove" class="btn btn-danger" disabled>
        <span id="removeLabel">削除</span>
      </button>
    </div>
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
  </footer>

  <script src="popup.js"></script>
</body>

</html>
