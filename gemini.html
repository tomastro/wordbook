<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Dictionary</title>
  <link rel="stylesheet" href="gemini.css" />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <img src="icon.png" alt="" class="brand-icon">
        <h1 class="brand-title">Dictionary</h1>
      </div>
    </header>

    <main class="app-main">
      <div id="wordHeader" class="word-card-header">
        <div class="title-wrap">
          <h2 id="wordTitle">読み込み中…</h2>
        </div>
        <div class="actions">
          <button id="addWordBtn" class="btn btn-primary" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>単語帳に追加</span>
          </button>
          <button id="regenerateBtn" class="btn btn-secondary" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
            </svg>
            <span>再生成</span>
          </button>
        </div>
      </div>

      <div id="loading" class="loader-container">
        <div class="loader-pulse" aria-hidden="true"></div>
        <p class="loader-text">辞書情報を生成しています…</p>
      </div>

      <div id="error" class="error-banner" role="alert" hidden></div>

      <div id="result" class="dictionary-result-card" hidden>
        <!-- content generated by Gemini goes here -->
      </div>
    </main>
  </div>

  <script src="marked.min.js"></script>
  <script src="gemini.js"></script>
</body>

</html>
