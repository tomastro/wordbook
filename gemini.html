<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>Gemini Dictionary</title>
  <link rel="stylesheet" href="gemini.css" />
</head>

<body>
  <header>
    <h1><img src="icon.png" alt="icon" style="width:fit-content; height:fit-content"> Gemini Dictionary</h1>
  </header>
  <main>
    <div id="wordHeader">
      <h2 id="wordTitle">Loading...</h2>
      <div class="actions">
        <button id="addWordBtn" hidden>+ Add to Wordbook</button>
        <button id="regenerateBtn" hidden>Regenerate</button>
      </div>
    </div>

    <div id="loading" class="spinner"></div>
    <div id="error" hidden></div>

    <div id="result" hidden>
      <!-- content generated by Gemini goes here -->
    </div>
  </main>
  <script src="marked.min.js"></script>
  <script src="gemini.js"></script>
</body>

</html>
